services:
  db:
    image: postgres:17-alpine
    container_name: evento
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: setme198
      POSTGRES_DB: db_evento
    ports:
      - 5433:5432
    shm_size: 128mb
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: